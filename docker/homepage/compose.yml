services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../../data/homepage/config:/app/config
      # Rootless Podman socket (Docker-compatible API) so the docker
      # integration can show container status. Podman is socket-activated:
      # the API daemon only starts when Homepage connects. scripts/homelab.sh
      # starts the (boot-disabled) socket unit before bringing stacks up.
      - ${PODMAN_SOCKET}:/var/run/podman.sock:ro
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    restart: unless-stopped
