services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ${HOMEPAGE_CONFIG_DIR}:/app/config
      - ${HOMEPAGE_MEDIA_DIR}:${HOMEPAGE_MEDIA_DIR}:ro
      - ${PODMAN_SOCKET}:/var/run/podman.sock:ro
      - ${TZ_FILE}:/etc/localtime:ro
    env_file: .env
    restart: unless-stopped
