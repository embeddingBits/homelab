services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_IMMICH_KEY: ${HOMEPAGE_VAR_IMMICH_KEY}
    volumes:
      - ${HOMEPAGE_HOST_CONFIG}:/app/config
      - ${HOMEPAGE_MEDIA_DIR}:${HOMEPAGE_MEDIA_DIR}:ro
      - ${PODMAN_SOCKET}:/var/run/podman.sock:ro
      - ${TZ_FILE}:/etc/localtime:ro
    restart: unless-stopped
