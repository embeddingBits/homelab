services:
  kavita:
    image: docker.io/jvmilazz0/kavita:latest
    container_name: kavita
    volumes:
      # Host paths come from .env (see .env.example).
      - ${KAVITA_BOOKS_DIR}:/books
      - ${KAVITA_COLLEGE_DIR}:/college_notes
      - ${KAVITA_CONFIG_DIR}:/kavita/config
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
