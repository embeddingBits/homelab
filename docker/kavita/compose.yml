services:
  kavita:
    image: docker.io/jvmilazz0/kavita:latest
    container_name: kavita
    volumes:
      - ${KAVITA_BOOKS_DIR}:/books
      - ${KAVITA_COLLEGE_DIR}:/college_notes
      - ../../data/kavita/config:/kavita/config
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "5000:5000"
    restart: unless-stopped
