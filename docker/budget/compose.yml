services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      - '127.0.0.1:5006:5006'
    environment:
    volumes:
      - ${ACTUAL_DATA_DIR}:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
